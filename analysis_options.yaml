# Static analysis rules (AGENTS.md, section 5): very_good_analysis + strict
# modes + riverpod_lint. `flutter analyze` must report zero issues.
# Disabling a rule is allowed only here, with a comment explaining why.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated or vendored code is not edited by hand.
    - rust_builder/**
    - lib/src/rust/**
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**

plugins:
  riverpod_lint: ^3.2.0

linter:
  rules:
    # This is an application, not a published package: public API docs are
    # required only where AGENTS.md asks for them, not on every widget.
    public_member_api_docs: false
